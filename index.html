<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dhrooby</title>
    <meta name="description" content="dhrooby — Unique Words and Color Sphere." />
    <link rel="canonical" href="https://www.dhrooby.com/" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #ece8df;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }

      main {
        width: min(100%, 28rem);
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-align: center;
      }

      .cards {
        display: grid;
        gap: 1.25rem;
      }

      a.card {
        display: block;
        overflow: hidden;
        background: #f7f4ed;
        border: 1px solid #d4cfc4;
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      a.card:hover {
        border-color: #a8a196;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .card-media {
        position: relative;
        width: 100%;
        aspect-ratio: 1200 / 630;
        background: #e8e4db;
        border-bottom: 1px solid #d4cfc4;
      }

      .card-media img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .card-body {
        padding: 0.9rem 1rem 1.05rem;
      }

      a.card strong {
        display: block;
        font-size: 1.05rem;
        margin-bottom: 0.2rem;
      }

      a.card span {
        font-size: 0.88rem;
        color: #555;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>dhrooby</h1>
      <nav class="cards" aria-label="Games">
        <a class="card" href="/unique-words/">
          <div class="card-media">
            <img src="/images/unique-words-og.png" alt="" />
          </div>
          <div class="card-body">
            <strong>Unique Words</strong>
            <span>Claim words no one has played yet.</span>
          </div>
        </a>
        <a class="card" href="/color-sphere/">
          <div class="card-media">
            <img src="/images/color-sphere-og.png" alt="" />
          </div>
          <div class="card-body">
            <strong>Color Sphere</strong>
            <span>Remember a flash of color on a 3D sphere.</span>
          </div>
        </a>
      </nav>
    </main>
  </body>
</html>
